name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (ASan/UBSan + GC stress)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DNYX_SANITIZE=ON -DNYX_GC_STRESS=ON

      - name: Build
        run: cmake --build build

      - name: Test under sanitizers
        run: ctest --test-dir build --output-on-failure

  benchmarks:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Run benchmarks
        run: |
          mkdir -p benchmarks/results
          python3 benchmarks/bench.py build/nyx 3 | tee benchmarks/results/ci-run.md

      - name: Upload benchmark output
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results/ci-run.md
        if: always()
